server:
  port: 8081
  servlet:
    context-path: /api/carta

  servlet:
    context-path: /suances

spring:
  application:
    name: carta-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carta}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:SuperSecretKeyQueEsMuyLargaYSegura2024ParaProduccion}
    expiration: 86400000
  redis:
    stream-events: sala.events
    stream-output: carta.events
    group: carta-group

logging:
  level:
    root: INFO
    "[com.suances.carta]": DEBUG
