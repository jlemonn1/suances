server:
  port: 8081

spring:
  application:
    name: carta-service
  datasource:
    url: jdbc:postgresql://localhost:5432/carta_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_MIN_256_BITS}
    expiration: 86400000
  redis:
    stream-events: sala.events
    stream-output: carta.events
    group: carta-group

logging:
  level:
    root: INFO
    com.suances.carta: DEBUG
