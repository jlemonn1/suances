server:
  port: 8085

  servlet:
    context-path: /suances

spring:
  application:
    name: personal-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_PERSONAL:personal}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:SuperSecretKeyQueEsMuyLargaYSegura2024ParaProduccion}
    expiration: 86400000
  security:
    bcrypt-strength: 12
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    create-on-startup: ${CREATE_ADMIN_USER:true}

logging:
  level:
    root: INFO
    "[main.java.com.suances.personnel]": DEBUG
    "[org.springframework.security]": INFO
