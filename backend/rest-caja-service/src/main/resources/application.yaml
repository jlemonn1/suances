server:
  port: 8082
  servlet:
    context-path: /suances

spring:
  application:
    name: caja

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/caja}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:SuperSecretKeyQueEsMuyLargaYSegura2024ParaProduccion}
  redis:
    stream-events: sala.events
    group: caja-group
    consumer: caja-consumer

logging:
  level:
    root: INFO
    "[com.suances.caja]": DEBUG
    "[org.springframework.security]": INFO
